name: Build Music Vibe APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install packages
        run: |
          npm install
          pip install pillow
      - name: Fix file names
        run: |
          fix() { if [ ! -f "$1" ]; then src=$(ls -1 $2 2>/dev/null | head -n1); if [ -n "$src" ]; then cp "$src" "$1"; fi; fi; }
          fix index.html 'index*.html'
          fix icon-192.png 'icon-192*.png'
          fix icon-512.png 'icon-512*.png'
          fix icon-maskable-512.png 'icon-maskable-512*.png'
          ls -la
      - name: Prepare web files
        run: |
          mkdir -p www
          cp index.html icon-192.png icon-512.png icon-maskable-512.png www/
          grep -q mediasession.js www/index.html || sed -i 's|<body>|<body>\n<script src="mediasession.js"></script>|' www/index.html
          npx esbuild mediasession-entry.js --bundle --minify --outfile=www/mediasession.js
      - name: Create Android project
        run: |
          npx cap add android
          npx cap sync android
          python3 patch_android.py
      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Publish APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Music Vibe build ${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
